<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nolan Poisson // CV Administrateur Syst?mes &amp; R?seaux</title>
  
  <!-- Polices Google : Space Grotesk + Plus Jakarta Sans + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm2 0v12h12V6H6zm2 2h8v2H8V8zm0 4h5v2H8v-2z'/></svg>">

  <style>
    /* ==========================================================================
       CV VIEWER HUD - THEME NEO-ENGINEERING CYBER COCKPIT
       ========================================================================== */
    :root {
      --bg-main: #0a0e17;
      --bg-secondary: #0f172a;
      --bg-toolbar: rgba(11, 15, 23, 0.92);
      --neon-red: #3b82f6;
      --neon-red-glow: rgba(59, 130, 246, 0.22);
      --accent-red-hover: #2563eb;
      --cyber-green: #10b981;
      --cyber-green-glow: rgba(16, 185, 129, 0.4);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-card: rgba(59, 130, 246, 0.18);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-body);
    }

    body {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-main);
      background-image: 
        linear-gradient(180deg, rgba(10, 14, 23, 0.88) 0%, rgba(10, 14, 23, 0.94) 100%),
        radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 60%),
        url('images/hero-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* --- Custom Cyber Scrollbar --- */
    ::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }
    ::-webkit-scrollbar-track {
      background: #070a12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
      border: 1px solid rgba(59, 130, 246, 0.15);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--neon-red);
      box-shadow: 0 0 10px var(--neon-red-glow);
    }

    /* ==========================================================================
       CUSTOM TOOLBAR (HEADER)
       ========================================================================== */
    .cv-toolbar {
      flex-shrink: 0;
      height: 64px;
      background: var(--bg-toolbar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
      z-index: 100;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .tb-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Brand / Document Label */
    .brand-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 6px;
    }

    .brand-chip {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      color: var(--neon-red);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
    }
    .brand-cursor {
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .doc-info {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .doc-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.2px;
    }
    .doc-subtitle {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
    }

    /* Buttons */
    .btn-cyber {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 38px;
      padding: 0 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-cyber svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Bouton Retour */
    .btn-outline {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
    }
    .btn-outline:hover {
      background: rgba(59, 130, 246, 0.08);
      border-color: var(--neon-red);
      color: var(--neon-red);
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.2);
      transform: translateY(-1px);
    }

    /* Bouton T?l?chargement */
    .btn-primary {
      background: var(--neon-red);
      border-color: var(--neon-red);
      color: #ffffff;
      box-shadow: 0 0 18px var(--neon-red-glow);
    }
    .btn-primary:hover {
      background: var(--accent-red-hover);
      border-color: var(--accent-red-hover);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.45);
      transform: translateY(-1px);
      color: #ffffff;
    }

    /* Zoom Cluster & Controls */
    .ctrl-cluster {
      display: inline-flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ctrl-btn svg {
      width: 16px;
      height: 16px;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }
    .ctrl-btn:active {
      transform: scale(0.94);
    }

    .ctrl-btn-text {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 10px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ctrl-btn-text svg {
      width: 14px;
      height: 14px;
    }
    .ctrl-btn-text:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .zoom-value {
      min-width: 54px;
      padding: 0 8px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .zoom-value:hover {
      background: rgba(59, 130, 246, 0.08);
      color: var(--neon-red);
    }

    .ctrl-divider {
      width: 1px;
      height: 20px;
      background: var(--border-subtle);
      margin: 0 3px;
    }

    /* Status Dot */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 9999px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--cyber-green);
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyber-green);
      box-shadow: 0 0 8px var(--cyber-green-glow);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* ==========================================================================
       VIEWPORT & CANVAS CONTAINER
       ========================================================================== */
    .cv-viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 16px 48px;
      position: relative;
    }

    .canvas-wrapper {
      position: relative;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.75),
        0 0 0 1px var(--border-card),
        0 0 35px rgba(59, 130, 246, 0.1);
      transition: box-shadow 0.25s ease;
      line-height: 0;
    }

    .canvas-wrapper:hover {
      box-shadow: 
        0 28px 70px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(59, 130, 246, 0.35),
        0 0 45px rgba(59, 130, 246, 0.15);
    }

    #pdf-canvas {
      display: block;
      border-radius: 6px;
    }

    /* Loader */
    .loader-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .cyber-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(59, 130, 246, 0.12);
      border-top-color: var(--neon-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 15px var(--neon-red-glow);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      letter-spacing: 1px;
    }

    /* Error Message */
    .error-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--neon-red);
      padding: 24px 32px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
      max-width: 440px;
    }
    .error-box p {
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* Shortcut HUD (bottom floating hint) */
    .shortcut-hud {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 11, 17, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      pointer-events: none;
      z-index: 50;
      opacity: 0.85;
      transition: opacity 0.3s;
    }
    .shortcut-hud kbd {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Responsive */
    @media (max-width: 992px) {
      .hide-tablet { display: none !important; }
    }
    @media (max-width: 768px) {
      .hide-mobile { display: none !important; }
      .cv-toolbar {
        padding: 0 10px;
        gap: 8px;
        height: 56px;
      }
      .btn-cyber {
        height: 34px;
        padding: 0 12px;
        font-size: 11px;
      }
      .cv-viewport {
        padding: 12px 8px 30px;
      }
      .shortcut-hud { display: none; }
    }

    /* ==========================================================================
       PRINT STYLES (Ultra clean A4 output without any UI)
       ========================================================================== */
    @media print {
      @page {
        margin: 0;
        size: auto;
      }
      html, body {
        background: #ffffff !important;
        height: auto !important;
        overflow: visible !important;
      }
      .cv-toolbar, .shortcut-hud, .loader-box, .error-box {
        display: none !important;
      }
      .cv-viewport {
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
        display: block !important;
      }
      .canvas-wrapper {
        box-shadow: none !important;
        border: none !important;
        margin: 0 auto !important;
        border-radius: 0 !important;
      }
      #pdf-canvas {
        max-width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- ==================== BARRE D'OUTILS CYBER PERSONNALIS?E ==================== -->
  <header class="cv-toolbar" role="toolbar" aria-label="Contr?les du document">
    
    <!-- Groupe Gauche : Bouton Retour + Identifiant -->
    <div class="tb-group">
      <button class="btn-cyber btn-outline" id="btn-back" onclick="goBack()" title="Retourner au portfolio (?chap)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>RETOUR</span>
      </button>

      <div class="brand-meta hide-mobile">
        <div class="doc-info">
          <span class="doc-title">CV_Nolan_Poisson.pdf</span>
          <span class="doc-subtitle">ADMINISTRATEUR SYST?MES &amp; R?SEAUX</span>
        </div>
      </div>
    </div>

    <!-- Groupe Centre : Commandes de Zoom -->
    <div class="tb-group hide-mobile">
      <div class="ctrl-cluster">
        <button class="ctrl-btn" id="btn-zoom-out" onclick="zoomOut()" title="Zoom arri?re (-)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="zoom-value" id="btn-zoom-reset" onclick="resetZoom()" title="R?initialiser (100%)">
          <span id="zoom-val">100%</span>
        </button>
        <button class="ctrl-btn" id="btn-zoom-in" onclick="zoomIn()" title="Zoom avant (+)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <div class="ctrl-divider hide-tablet"></div>
        <button class="ctrl-btn-text hide-tablet" id="btn-fit-width" onclick="fitWidth()" title="Ajuster ? la largeur de la fen?tre">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 8 1 12 4 16"></polyline>
            <polyline points="20 8 23 12 20 16"></polyline>
            <line x1="1" y1="12" x2="23" y2="12"></line>
          </svg>
          <span>Largeur</span>
        </button>
        <button class="ctrl-btn-text hide-tablet" id="btn-fit-page" onclick="fitPage()" title="Adapter ? la hauteur de page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="8 4 12 1 16 4"></polyline>
            <polyline points="8 20 12 23 16 20"></polyline>
            <line x1="12" y1="1" x2="12" y2="23"></line>
          </svg>
          <span>Page</span>
        </button>
      </div>
    </div>

    <!-- Groupe Droite : Impression + T?l?chargement + Plein ?cran -->
    <div class="tb-group">
      <div class="status-badge hide-tablet">
        <span class="status-dot"></span>
        <span>A4 // 1 PAGE</span>
      </div>

      <button class="btn-cyber btn-outline hide-mobile" id="btn-print" onclick="window.print()" title="Imprimer le CV (Ctrl+P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span class="hide-tablet">IMPRIMER</span>
      </button>

      <!-- Bouton T?l?chargement -->
      <a class="btn-cyber btn-primary" id="btn-download" href="CV-Nolan-POISSON.pdf" download="CV_Nolan_Poisson.pdf" title="T?l?charger le fichier PDF sur votre appareil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>T?L?CHARGER LE CV</span>
      </a>

      <button class="ctrl-btn hide-mobile" id="btn-fullscreen" onclick="toggleFullscreen()" title="Plein ?cran (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>

  </header>

  <!-- ==================== ZONE DE RENDU DU CV ==================== -->
  <main class="cv-viewport" id="viewport">
    
    <!-- Indicateur de Chargement -->
    <div class="loader-box" id="loader">
      <div class="cyber-spinner"></div>
      <div class="loader-text">[ CHARGEMENT DU CV // RENDU HAUTE D?FINITION ]</div>
    </div>

    <!-- Message d'Erreur avec T?l?chargement direct en repli -->
    <div class="error-box" id="error-box" style="display: none;">
      <p>Le document n'a pas pu ?tre rendu dynamiquement sur ce navigateur.</p>
      <a class="btn-cyber btn-primary" href="CV-Nolan-POISSON.pdf" download="CV_Nolan_Poisson.pdf">
        T?l?charger directement le PDF
      </a>
    </div>

    <!-- Conteneur Canvas HD -->
    <div class="canvas-wrapper" id="canvas-card" style="display: none;">
      <canvas id="pdf-canvas"></canvas>
    </div>

  </main>

  <!-- Raccourcis Clavier Flottants -->
  <div class="shortcut-hud hide-mobile">
    <span><kbd>?chap</kbd> Retour</span>
    <span><kbd>+</kbd> / <kbd>-</kbd> Zoom</span>
    <span><kbd>0</kbd> R?initialiser</span>
    <span><kbd>Ctrl+P</kbd> Imprimer</span>
  </div>

  <!-- PDF.js : Chargement local puis fallback CDN si besoin -->
  <script src="pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>');
    }
  </script>

  <!-- ==================== LOGIQUE DU VIEWER ==================== -->
  <script>
    // Configuration du worker PDF.js
    if (typeof pdfjsLib !== 'undefined') {
      try {
        if (window.location.protocol === 'file:') {
          // Sous protocole file://, on utilise le faux worker ou chemin local
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
        } else {
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
        }
      } catch (e) {
        console.warn('Configuration worker fallback:', e);
      }

    let pdfDoc = null;
    let pageNum = 1;
    let currentScale = 1.0;
    let baseViewport = null;
    let isRendering = false;
    let renderPending = false;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const canvasCard = document.getElementById('canvas-card');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('error-box');
    const zoomVal = document.getElementById('zoom-val');
    const viewport = document.getElementById('viewport');

    // Navigation de retour s?curis?e
    function goBack() {
      if (window.history.length > 1 && document.referrer) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    // Toggle Plein ?cran
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.warn(err));
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Conversion Base64 -> Uint8Array
    function base64ToUint8Array(base64) {
      const raw = window.atob(base64);
      const rawLength = raw.length;
      const array = new Uint8Array(new ArrayBuffer(rawLength));
      for (let i = 0; i < rawLength; i++) {
        array[i] = raw.charCodeAt(i);
      }
      return array;
    }

    // Rendu haute pr?cision de la page
    function renderPage() {
      if (!pdfDoc) return;
      if (isRendering) {
        renderPending = true;
        return;
      }
      isRendering = true;

      pdfDoc.getPage(pageNum).then(page => {
        const vp = page.getViewport({ scale: currentScale });
        const outputScale = window.devicePixelRatio || 1;

        canvas.width = Math.floor(vp.width * outputScale);
        canvas.height = Math.floor(vp.height * outputScale);
        canvas.style.width = Math.floor(vp.width) + "px";
        canvas.style.height = Math.floor(vp.height) + "px";

        const transform = outputScale !== 1 
          ? [outputScale, 0, 0, outputScale, 0, 0] 
          : null;

        const renderContext = {
          canvasContext: ctx,
          transform: transform,
          viewport: vp
        };

        const renderTask = page.render(renderContext);
        renderTask.promise.then(() => {
          isRendering = false;
          if (renderPending) {
            renderPending = false;
            renderPage();
          }
        }).catch(err => {
          console.error("Erreur de rendu canvas:", err);
          isRendering = false;
        });
      });

      zoomVal.textContent = Math.round(currentScale * 100) + '%';
    }

    // Actions Zoom
    function zoomIn() {
      currentScale = Math.min(3.0, currentScale + 0.15);
      renderPage();
    }

    function zoomOut() {
      currentScale = Math.max(0.4, currentScale - 0.15);
      renderPage();
    }

    function resetZoom() {
      currentScale = 1.0;
      renderPage();
    }

    function fitWidth() {
      if (!baseViewport) return;
      const availWidth = viewport.clientWidth - 48;
      currentScale = Math.max(0.4, Math.min(2.5, availWidth / baseViewport.width));
      renderPage();
    }

    function fitPage() {
      if (!baseViewport) return;
      const availHeight = viewport.clientHeight - 48;
      const availWidth = viewport.clientWidth - 48;
      const scaleH = availHeight / baseViewport.height;
      const scaleW = availWidth / baseViewport.width;
      currentScale = Math.max(0.4, Math.min(2.0, Math.min(scaleH, scaleW)));
      renderPage();
    }

    // Initialisation du chargement PDF
    async function initPDF() {
      try {
        let loadingTask = null;

        // Si servi via HTTP/HTTPS, tenter de charger le fichier direct
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
          try {
            loadingTask = pdfjsLib.getDocument('CV-Nolan-POISSON.pdf');
            pdfDoc = await loadingTask.promise;
          } catch (e) {
            console.warn('Tentative via fichier directe ?chou?e, bascule vers Base64...', e);
          }
        }

        // Si non charg? (ou protocole local file://), utiliser les donn?es Base64
        if (!pdfDoc && EMBEDDED_PDF_B64) {
          const pdfData = base64ToUint8Array(EMBEDDED_PDF_B64);
          loadingTask = pdfjsLib.getDocument({ data: pdfData });
          pdfDoc = await loadingTask.promise;
        }

        if (!pdfDoc) throw new Error("Impossible d'initialiser le document PDF");

        // Obtenir la premi?re page pour calculer les dimensions
        const firstPage = await pdfDoc.getPage(1);
        baseViewport = firstPage.getViewport({ scale: 1.0 });

        // Calcul de l'?chelle initiale id?ale
        const availWidth = viewport.clientWidth - 40;
        const availHeight = viewport.clientHeight - 50;

        if (window.innerWidth <= 768) {
          // Mobile : adapter ? la largeur
          currentScale = Math.min(1.2, availWidth / baseViewport.width);
        } else {
          // Desktop : adapter ? la hauteur pour vue d'ensemble imm?diate
          const scaleH = availHeight / baseViewport.height;
          const scaleW = availWidth / baseViewport.width;
          currentScale = Math.min(1.25, Math.min(scaleH, scaleW));
        }

        // Masquer le loader et afficher le canvas
        loader.style.display = 'none';
        canvasCard.style.display = 'inline-block';

        renderPage();

      } catch (err) {
        console.error("?chec du chargement PDF :", err);
        loader.style.display = 'none';
        errorBox.style.display = 'block';
      }
    }

    // Gestion des Raccourcis Clavier
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        goBack();
      } else if (e.key === '+' || e.key === '=') {
        if (e.ctrlKey) e.preventDefault();
        zoomIn();
      } else if (e.key === '-' || e.key === '_') {
        if (e.ctrlKey) e.preventDefault();
        zoomOut();
      } else if (e.key === '0') {
        fitPage();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    // Redimensionnement automatique de la fen?tre (debounce)
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        // Ne recalcule que si l'?cran est petit ou sur orientation change
        if (window.innerWidth <= 768) {
          fitWidth();
        }
      }, 200);
    });

    // Lancement au chargement du DOM
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPDF);
    } else {
      initPDF();
    }
